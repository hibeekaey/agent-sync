name: compat

# agent mcp drives other vendors' CLIs by their documented flag grammar.
# That grammar is a contract we do not control, so check weekly that every
# flag agent-sync actually passes still exists, rather than discovering a
# break through a user's broken configuration. Only --help is exercised: no
# account, no network mutations.
#
# Each assertion is "help arguments :: token", derived from the invocations
# in mcp_push_cli and mcp_remove_cli. A package that cannot be installed is
# a failure, not a skip: a renamed or withdrawn package is itself a
# compatibility break.
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  grammar:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The synthesizer command lines (bin/agent synth_command) are
          # asserted alongside the mcp grammar.
          - tool: claude
            package: '@anthropic-ai/claude-code'
            assertions: |
              mcp add-json --help :: --scope
              mcp remove --help :: --scope
              --help :: -p
              --help :: --no-session-persistence
              --help :: --permission-mode
              --help :: --strict-mcp-config
              --help :: --mcp-config
              --help :: --model
              --help :: --effort
          - tool: codex
            package: '@openai/codex'
            assertions: |
              mcp add --help :: --url
              mcp add --help :: --env
              mcp remove --help :: mcp remove
              exec --help :: --skip-git-repo-check
              exec --help :: --sandbox
              exec --help :: --ephemeral
              exec --help :: --color
              exec --help :: -m
              exec --help :: -c
          - tool: gemini
            package: '@google/gemini-cli'
            assertions: |
              mcp add --help :: --transport
              mcp add --help :: --header
              mcp add --help :: -s
              mcp add --help :: -e
              mcp remove --help :: -s
          - tool: qwen
            package: '@qwen-code/qwen-code'
            assertions: |
              mcp add --help :: --transport
              mcp add --help :: --header
              mcp add --help :: -s
              mcp add --help :: -e
              mcp remove --help :: -s
          # Amp takes no flags in the calls agent-sync makes, so the
          # contract is that both subcommands still exist.
          - tool: amp
            package: '@sourcegraph/amp'
            assertions: |
              mcp --help :: add
              mcp --help :: remove
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: install ${{ matrix.tool }}
        run: |
          # Retry for transient registry failures. Exhausting the retries
          # means the package is gone or renamed, which is a real finding.
          for attempt in 1 2 3; do
            if npm install -g ${{ matrix.package }}; then
              exit 0
            fi
            echo "install attempt $attempt failed; retrying"
            sleep $((attempt * 10))
          done
          echo "::error::${{ matrix.package }} could not be installed after" \
            "3 attempts. If it was renamed or withdrawn, agent-sync's" \
            "support for ${{ matrix.tool }} needs updating." >&2
          exit 1
      # Matching lives in a script so it can be unit tested; see
      # tests/compat_test.sh, which pins the substring false positives.
      - name: every flag agent-sync passes must still exist
        env:
          TOOL: ${{ matrix.tool }}
          ASSERTIONS: ${{ matrix.assertions }}
        run: |
          if ! printf '%s\n' "$ASSERTIONS" | scripts/check-cli-grammar.sh "$TOOL"; then
            echo "::error::$TOOL no longer documents grammar that agent" \
              "depends on (mcp sync or the synthesizer); see the failures above" >&2
            exit 1
          fi
