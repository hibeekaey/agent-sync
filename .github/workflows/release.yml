name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  assets:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: build checksummed assets
        run: |
          cp bin/agent agent
          sha256sum agent > SHA256SUMS
      - name: attach to the release
        run: |
          gh release upload "$GITHUB_REF_NAME" agent SHA256SUMS --clobber ||
            gh release create "$GITHUB_REF_NAME" agent SHA256SUMS --generate-notes

  tap:
    needs: assets
    runs-on: ubuntu-latest
    steps:
      - name: bump the Homebrew formula
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "TAP_TOKEN secret not set; skipping the tap bump"
            exit 0
          fi
          URL="https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${GITHUB_REF_NAME}.tar.gz"
          SHA=$(curl -sL "$URL" | sha256sum | cut -d' ' -f1)
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/hibeekaey/homebrew-tap.git" tap
          cd tap
          sed -i "s|url \".*\"|url \"$URL\"|; s|sha256 \".*\"|sha256 \"$SHA\"|" Formula/agent-sync.rb
          git config user.name "agent-sync-release"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: agent-sync ${GITHUB_REF_NAME#v}"
          git push
