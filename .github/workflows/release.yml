name: release

# Merging the version bump is the release. On every push to main this reads
# VERSION from bin/agent: if a release for that version already exists there
# is nothing to do, otherwise it cuts one.
#
# The release is assembled as a draft and published only once its assets are
# attached, because GitHub's immutable releases freeze a release's tag and
# assets at publication.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.decide.outputs.release }}
      tag: ${{ steps.decide.outputs.tag }}
      previous: ${{ steps.decide.outputs.previous }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: decide
        run: |
          VERSION=$(sed -n 's/^VERSION="\(.*\)"$/\1/p' bin/agent)
          if [ -z "$VERSION" ]; then
            echo "could not read VERSION from bin/agent" >&2
            exit 1
          fi
          TAG="v$VERSION"
          # The REST latest endpoint excludes drafts, so a stalled attempt
          # cannot become its own predecessor.
          PREV=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name 2>/dev/null || echo "")
          echo "tag=$TAG" >>"$GITHUB_OUTPUT"
          echo "previous=$PREV" >>"$GITHUB_OUTPUT"

          # A leftover draft means a previous attempt stopped before
          # publishing, so resume it. Only a published release is done.
          if gh release view "$TAG" >/dev/null 2>&1; then
            if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = "true" ]; then
              echo "$TAG exists as a draft; resuming it"
            else
              echo "$TAG is already released; nothing to do"
              echo "release=false" >>"$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          # A version that sorts at or below the current release would tag
          # history backwards, so refuse rather than guess.
          if [ -n "$PREV" ]; then
            HIGHEST=$(printf '%s\n%s\n' "${PREV#v}" "$VERSION" | sort -V | tail -1)
            if [ "$HIGHEST" != "$VERSION" ]; then
              echo "VERSION $VERSION is not newer than the current release $PREV" >&2
              exit 1
            fi
          fi
          echo "releasing $TAG (previous: ${PREV:-none})"
          echo "release=true" >>"$GITHUB_OUTPUT"

  # A release can be cut from a commit that bypassed the pull-request
  # checks, so the suite runs again here instead of being assumed.
  verify:
    needs: check
    if: needs.check.outputs.release == 'true'
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: shellcheck
        if: runner.os == 'Linux'
        run: shellcheck bin/agent
      - name: behavioral suite
        run: make test

  publish:
    needs: [check, verify]
    permissions:
      contents: write
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.check.outputs.tag }}
      PREV: ${{ needs.check.outputs.previous }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: compose the release notes
        run: |
          VERSION=${TAG#v}
          # The changelog entry is the release note when it exists.
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { inside = 1; next }
            inside && /^## \[/ { exit }
            inside { print }
          ' CHANGELOG.md >section.md
          if [ -s section.md ] && grep -q '[^[:space:]]' section.md; then
            cat section.md >notes.md
          else
            echo "No changelog entry for $VERSION." >notes.md
          fi
          # The commit log and diff are always appended, changelog or not.
          {
            printf '\n## Changes'
            if [ -n "$PREV" ]; then printf ' since %s' "$PREV"; fi
            printf '\n\n'
            if [ -n "$PREV" ]; then
              git log --no-merges --pretty='- %s (%h)' "$PREV..HEAD"
              printf '\n'
              printf '%s\n\n' "$(git diff --shortstat "$PREV..HEAD")"
              printf 'Full diff: https://github.com/%s/compare/%s...%s\n' \
                "$GITHUB_REPOSITORY" "$PREV" "$TAG"
            else
              git log --no-merges --pretty='- %s (%h)'
            fi
          } >>notes.md
          echo "--- release notes ---"
          cat notes.md
      - name: create or refresh the draft
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --target "$GITHUB_SHA" --notes-file notes.md
            echo "refreshed the existing draft"
          else
            gh release create "$TAG" --draft --target "$GITHUB_SHA" \
              --title "$TAG" --notes-file notes.md
          fi
      - name: the bundled skill must validate
        run: gh skill publish --dry-run
      - name: build checksummed assets
        run: |
          cp bin/agent agent
          sha256sum agent > SHA256SUMS
      - name: attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: agent
      - name: attach the assets to the draft
        run: gh release upload "$TAG" agent SHA256SUMS --clobber
      - name: publish
        run: gh release edit "$TAG" --draft=false

  tap:
    needs: [check, publish]
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.check.outputs.tag }}
    steps:
      - name: bump the Homebrew formula
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "TAP_TOKEN secret not set; skipping the tap bump"
            exit 0
          fi
          URL="https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${TAG}.tar.gz"
          SHA=$(curl -fsSL "$URL" | sha256sum | cut -d' ' -f1)
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/hibeekaey/homebrew-tap.git" tap
          cd tap
          sed -i "s|url \".*\"|url \"$URL\"|; s|sha256 \".*\"|sha256 \"$SHA\"|" Formula/agent-sync.rb
          if git diff --quiet; then
            echo "formula already current; nothing to bump"
            exit 0
          fi
          git config user.name "agent-sync-release"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: agent-sync ${TAG#v}"
          git push

  # Prove the published artifacts install, rather than trusting that they
  # were uploaded.
  smoke:
    needs: [check, tap]
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.check.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: the installer fetches, verifies and installs the release
        run: |
          AGENT_SYNC_VERSION="$TAG" PREFIX="$HOME/.smoke" sh install.sh
          GOT=$("$HOME/.smoke/bin/agent" version)
          [ "$GOT" = "agent $TAG" ] || {
            echo "installer produced '$GOT', expected 'agent $TAG'" >&2
            exit 1
          }
      - name: the attestation verifies against this repository
        run: gh attestation verify "$HOME/.smoke/bin/agent" --repo "$GITHUB_REPOSITORY"
      - name: homebrew installs the released formula
        if: runner.os == 'macOS'
        run: |
          brew tap hibeekaey/tap
          brew install hibeekaey/tap/agent-sync
          GOT=$(agent version)
          [ "$GOT" = "agent $TAG" ] || {
            echo "brew produced '$GOT', expected 'agent $TAG'" >&2
            exit 1
          }
