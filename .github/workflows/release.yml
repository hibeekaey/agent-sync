name: release

# Run this workflow to release. It attaches assets to a draft and only then
# publishes, which is what GitHub's immutable releases require: once a
# release is published its tag and assets are frozen, so anything uploaded
# afterwards is rejected.
#
# Authoring notes still happens on the Releases page. Save a draft with the
# release tag and this workflow will find it, keep your notes, attach the
# attested assets and publish it. With no draft it creates one and
# generates notes.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v1.5.4
        required: true
        type: string

permissions:
  contents: read

jobs:
  # A release can be cut from a commit that bypassed the pull-request
  # checks, so the suite runs again here instead of being assumed.
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: the tag must be a version tag
        run: |
          case "${{ inputs.tag }}" in
            v[0-9]*) ;;
            *)
              echo "expected a v-prefixed tag, got '${{ inputs.tag }}'" >&2
              exit 1
              ;;
          esac
      - name: the released binary must declare the released version
        run: |
          DECLARED=$(sed -n 's/^VERSION="\(.*\)"$/\1/p' bin/agent)
          if [ "v$DECLARED" != "${{ inputs.tag }}" ]; then
            echo "bin/agent declares v$DECLARED but the release is ${{ inputs.tag }}" >&2
            exit 1
          fi
      - name: shellcheck
        if: runner.os == 'Linux'
        run: shellcheck bin/agent
      - name: behavioral suite
        run: make test

  publish:
    needs: verify
    permissions:
      contents: write
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: find or create the draft
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" != "true" ]; then
              echo "$TAG is already published; its assets cannot be replaced" >&2
              exit 1
            fi
            echo "using the existing draft and its notes"
          else
            gh release create "$TAG" --draft --target "$GITHUB_SHA" \
              --title "$TAG" --generate-notes
            echo "created a draft with generated notes"
          fi
      - name: the bundled skill must validate
        run: gh skill publish --dry-run
      - name: build checksummed assets
        run: |
          cp bin/agent agent
          sha256sum agent > SHA256SUMS
      - name: attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: agent
      - name: attach the assets to the draft
        run: gh release upload "$TAG" agent SHA256SUMS --clobber
      - name: publish
        run: gh release edit "$TAG" --draft=false

  tap:
    needs: publish
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - name: bump the Homebrew formula
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "TAP_TOKEN secret not set; skipping the tap bump"
            exit 0
          fi
          URL="https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${TAG}.tar.gz"
          SHA=$(curl -fsSL "$URL" | sha256sum | cut -d' ' -f1)
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/hibeekaey/homebrew-tap.git" tap
          cd tap
          sed -i "s|url \".*\"|url \"$URL\"|; s|sha256 \".*\"|sha256 \"$SHA\"|" Formula/agent-sync.rb
          if git diff --quiet; then
            echo "formula already current; nothing to bump"
            exit 0
          fi
          git config user.name "agent-sync-release"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: agent-sync ${TAG#v}"
          git push

  # Prove the published artifacts install, rather than trusting that they
  # were uploaded.
  smoke:
    needs: tap
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: the installer fetches, verifies and installs the release
        run: |
          AGENT_SYNC_VERSION="$TAG" PREFIX="$HOME/.smoke" sh install.sh
          GOT=$("$HOME/.smoke/bin/agent" version)
          [ "$GOT" = "agent $TAG" ] || {
            echo "installer produced '$GOT', expected 'agent $TAG'" >&2
            exit 1
          }
      - name: the attestation verifies against this repository
        run: gh attestation verify "$HOME/.smoke/bin/agent" --repo "$GITHUB_REPOSITORY"
      - name: homebrew installs the released formula
        if: runner.os == 'macOS'
        run: |
          brew tap hibeekaey/tap
          brew install hibeekaey/tap/agent-sync
          GOT=$(agent version)
          [ "$GOT" = "agent $TAG" ] || {
            echo "brew produced '$GOT', expected 'agent $TAG'" >&2
            exit 1
          }
